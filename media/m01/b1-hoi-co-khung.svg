<svg xmlns="http://www.w3.org/2000/svg" class="sd sd-c" viewBox="0 0 720 470" role="img" aria-label="Cùng một câu hỏi về con số: hỏi trống thì AI đoán, hỏi có khung thì AI ghi nguồn hoặc nói không có số liệu"><defs><linearGradient id="hcg" x1="0" x2="1"><stop offset="0" stop-color="#B23BF0"/><stop offset=".45" stop-color="#7C5CF7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><marker id="hca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect x="8" y="10" width="344" height="380" rx="18" fill="#fff" stroke="#E7E9F7" stroke-width="1.5"/><rect x="9" y="11" width="342" height="5" rx="2.5" fill="url(#hcg)"/><text x="28" y="44" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#7C3AED" text-anchor="start">Cách 1 · Hỏi trống</text><rect x="64" y="60" width="272" height="116" rx="16" fill="#F7F8FE" stroke="#E7E9F7" stroke-width="1.5"/><text x="80" y="86" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#5B6577" text-anchor="start">Bạn hỏi</text><text x="80" y="110" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#030815" text-anchor="22">Tỷ lệ khách quay lại của</text><text x="80" y="132" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#030815" text-anchor="22">tiệm spa là bao nhiêu?</text><text x="80" y="154" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#030815" text-anchor="22">Trả lời một con số.</text><rect x="24" y="192" width="272" height="92" rx="16" fill="url(#hcg)"/><text x="40" y="218" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="start">AI trả lời</text><text x="40" y="242" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="22">AI dễ đoán một con số,</text><text x="40" y="264" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="22">không ghi nguồn</text><rect x="24" y="300" width="312" height="74" rx="14" fill="#FFF5F8" stroke="#F6B8CB" stroke-width="1.5"/><text x="42" y="331.1" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#A3002F" text-anchor="start">Không có nguồn,</text><text x="42" y="355.1" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#A3002F" text-anchor="start">bạn khó biết sai</text><rect x="368" y="10" width="344" height="380" rx="18" fill="#fff" stroke="#E7E9F7" stroke-width="1.5"/><rect x="369" y="11" width="342" height="5" rx="2.5" fill="url(#hcg)"/><text x="388" y="44" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#7C3AED" text-anchor="start">Cách 2 · Hỏi có khung</text><rect x="424" y="60" width="272" height="116" rx="16" fill="#F7F8FE" stroke="#E7E9F7" stroke-width="1.5"/><text x="440" y="86" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#5B6577" text-anchor="start">Bạn hỏi</text><text x="440" y="110" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#030815" text-anchor="22">Không có số liệu đáng tin</text><text x="440" y="132" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#030815" text-anchor="22">thì nói thẳng. Có số thì</text><text x="440" y="154" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#030815" text-anchor="22">ghi nguồn và năm.</text><rect x="384" y="192" width="272" height="92" rx="16" fill="url(#hcg)"/><text x="400" y="218" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="start">AI trả lời</text><text x="400" y="242" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="22">AI ghi nguồn, hoặc nói</text><text x="400" y="264" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="22">không có số liệu</text><rect x="384" y="300" width="312" height="74" rx="14" fill="#EEFBF3" stroke="#A7E3BF" stroke-width="1.5"/><text x="402" y="331.1" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0B6B3A" text-anchor="start">Bạn mở nguồn</text><text x="402" y="355.1" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0B6B3A" text-anchor="start">ra kiểm được</text><text x="360" y="424" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#5B6577" text-anchor="middle">Cùng một AI, cùng một câu hỏi. Hỏi có khung thì AI ít đoán hơn,</text><text x="360" y="447" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#5B6577" text-anchor="middle">nhưng bạn vẫn phải kiểm.</text></svg>