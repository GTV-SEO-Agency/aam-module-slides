<svg xmlns="http://www.w3.org/2000/svg" class="sd sd-c" viewBox="0 0 720 552" role="img" aria-label="Bảng chấm Giờ nhân Rủi ro: bốn ô Giao trước, Giao kèm duyệt, Gom làm sau, Giữ cho người"><defs><linearGradient id="hdg" x1="0" x2="1"><stop offset="0" stop-color="#B23BF0"/><stop offset=".45" stop-color="#7C5CF7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><marker id="hda" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><text x="8" y="22" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#64748B" text-anchor="start">Rủi ro 1–2</text><rect x="4" y="34" width="350" height="190" rx="18" fill="#F1F3F7" stroke="#D5DAE3" stroke-width="2"/><circle cx="42" cy="78" r="20" fill="#334155"/><text x="42" y="84.7" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="74" y="86" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="23" font-weight="800" fill="#334155" text-anchor="start">Gom làm sau</text><text x="26" y="130" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#030815" text-anchor="start">Dưới 2 giờ/tuần · rủi ro 1–2</text><text x="26" y="172" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="400" fill="#030815" text-anchor="start">Để sau, gom việc nhỏ</text><text x="26" y="197" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="400" fill="#030815" text-anchor="start">cùng loại thành một Skill</text><rect x="366" y="34" width="350" height="190" rx="18" fill="#EEFBF3" stroke="#A7E3BF" stroke-width="2"/><circle cx="404" cy="78" r="20" fill="#0B6B3A"/><text x="404" y="84.7" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="436" y="86" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="23" font-weight="800" fill="#0B6B3A" text-anchor="start">Giao trước</text><text x="388" y="130" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#030815" text-anchor="start">Từ 2 giờ/tuần · rủi ro 1–2</text><text x="388" y="172" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="400" fill="#030815" text-anchor="start">AI làm, người đọc lại</text><text x="388" y="197" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="400" fill="#030815" text-anchor="start">khi rủi ro mức 2</text><text x="8" y="256" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#64748B" text-anchor="start">Rủi ro 3</text><rect x="4" y="268" width="350" height="190" rx="18" fill="#FFF5F8" stroke="#F6B8CB" stroke-width="2"/><circle cx="42" cy="312" r="20" fill="#A3002F"/><text x="42" y="318.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="74" y="320" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="23" font-weight="800" fill="#A3002F" text-anchor="start">Giữ cho người</text><text x="26" y="364" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#030815" text-anchor="start">Dưới 2 giờ/tuần · rủi ro 3</text><text x="26" y="406" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="400" fill="#030815" text-anchor="start">Người làm, AI chỉ gợi ý</text><text x="26" y="431" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="400" fill="#030815" text-anchor="start">khi được hỏi</text><rect x="366" y="268" width="350" height="190" rx="18" fill="#E6F3FC" stroke="#A9D4F2" stroke-width="2"/><circle cx="404" cy="312" r="20" fill="#05609A"/><text x="404" y="318.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="436" y="320" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="23" font-weight="800" fill="#05609A" text-anchor="start">Giao kèm duyệt</text><text x="388" y="364" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#030815" text-anchor="start">Từ 2 giờ/tuần · rủi ro 3</text><text x="388" y="406" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="400" fill="#030815" text-anchor="start">AI làm nháp, người duyệt</text><text x="388" y="431" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="400" fill="#030815" text-anchor="start">từng lần trước khi gửi</text><text x="179.0" y="486" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#64748B" text-anchor="middle">Dưới 2 giờ/tuần</text><text x="541.0" y="486" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#64748B" text-anchor="middle">Từ 2 giờ/tuần</text><text x="360" y="520" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#64748B" text-anchor="middle">Số trong vòng tròn là thứ tự giao việc cho AI.</text><text x="360" y="544" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#64748B" text-anchor="middle">Trong cùng ô, việc nhiều giờ hơn đi trước.</text></svg>