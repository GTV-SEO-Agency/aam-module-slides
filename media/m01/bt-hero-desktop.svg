<svg xmlns="http://www.w3.org/2000/svg" class="sd sd-c" viewBox="0 0 720 410" role="img" aria-label="Phễu bài tập: ghi 15 đến 20 việc, lọc việc lặp, chấm giờ và rủi ro, ra 10 việc xếp thứ tự"><defs><linearGradient id="hcg" x1="0" x2="1"><stop offset="0" stop-color="#B23BF0"/><stop offset=".45" stop-color="#7C5CF7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><marker id="hca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect x="8.0" y="8" width="704" height="88" rx="18" fill="#F7F8FE" stroke="#E7E9F7" stroke-width="1.5"/><text x="360" y="46" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="21" font-weight="800" fill="#030815" text-anchor="middle">Ghi 15–20 việc</text><text x="360" y="76" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#5B6577" text-anchor="middle">bắt đầu từ danh sách bài 2 và 3 · khoảng 15 phút</text><rect x="49.0" y="110" width="622" height="88" rx="18" fill="#F7F8FE" stroke="#E7E9F7" stroke-width="1.5"/><text x="360" y="148" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="21" font-weight="800" fill="#030815" text-anchor="middle">Lọc việc lặp, tách việc to</text><text x="360" y="178" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#5B6577" text-anchor="middle">bỏ việc làm một lần · khoảng 10 phút</text><rect x="90.0" y="212" width="540" height="88" rx="18" fill="#F7F8FE" stroke="#E7E9F7" stroke-width="1.5"/><text x="360" y="250" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="21" font-weight="800" fill="#030815" text-anchor="middle">Ước giờ, chấm rủi ro</text><text x="360" y="280" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#5B6577" text-anchor="middle">Bảng chấm Giờ × Rủi ro của bài 3 · khoảng 20 phút</text><rect x="131.0" y="314" width="458" height="88" rx="18" fill="url(#hcg)"/><text x="360" y="352" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">10 việc xếp thứ tự</text><text x="360" y="382" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">chọn 3 việc cho Module 04 · khoảng 10 phút</text></svg>