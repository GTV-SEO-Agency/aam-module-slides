<svg xmlns="http://www.w3.org/2000/svg" class="sd sd-c" viewBox="0 0 720 474" role="img" aria-label="Năm phần của file giọng thương hiệu, mỗi phần một dòng ví dụ của Spa An Nhiên"><defs><linearGradient id="s7b1a2cg" x1="0" x2="1"><stop offset="0" stop-color="#B23BF0"/><stop offset=".45" stop-color="#7C5CF7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><marker id="s7b1a2ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect x="8" y="8" width="704" height="458" rx="18" fill="#fff" stroke="#E4E7F2" stroke-width="1.5"/><rect x="8" y="8" width="704" height="5" rx="2.5" fill="url(#s7b1a2cg)"/><text x="32" y="46" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="20" font-weight="800" fill="#030815" text-anchor="start">File giọng · Spa An Nhiên</text><rect x="24" y="70" width="672" height="68" rx="14" fill="#F7F8FC" stroke="#E4E7F2" stroke-width="1.5"/><circle cx="56" cy="104.0" r="17" fill="#64748B"/><text x="56" y="110.3" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="88" y="98" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#030815" text-anchor="start">Xưng hô</text><text x="88" y="124" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1E293B" text-anchor="start">Spa xưng “tụi mình”, gọi khách “anh/chị”.</text><rect x="24" y="148" width="672" height="68" rx="14" fill="#F7F8FC" stroke="#E4E7F2" stroke-width="1.5"/><circle cx="56" cy="182.0" r="17" fill="#64748B"/><text x="56" y="188.3" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="88" y="176" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#030815" text-anchor="start">Người đọc là ai, đang lo gì</text><text x="88" y="202" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1E293B" text-anchor="start">Nữ văn phòng 25–40 tuổi, làm ca dài, cần thư giãn.</text><rect x="24" y="226" width="672" height="68" rx="14" fill="#F3F0FF" stroke="#CFC3FF" stroke-width="2"/><circle cx="56" cy="260.0" r="17" fill="#7C3AED"/><text x="56" y="266.3" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="88" y="254" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#4318C9" text-anchor="start">Ba bài mẫu thật</text><text x="88" y="280" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1E293B" text-anchor="start">Bài Facebook, tin Zalo gửi khách cũ, bài web ngắn.</text><rect x="476.2" y="235" width="203.8" height="30" rx="15.0" fill="#fff" stroke="#CFC3FF" stroke-width="1.2"/><text x="578.1" y="255.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="middle">Claude học nhiều nhất</text><rect x="24" y="304" width="672" height="68" rx="14" fill="#F7F8FC" stroke="#E4E7F2" stroke-width="1.5"/><circle cx="56" cy="338.0" r="17" fill="#64748B"/><text x="56" y="344.3" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="88" y="332" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#030815" text-anchor="start">Câu và từ không dùng</text><text x="88" y="358" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1E293B" text-anchor="start">Không đưa khuyến mãi vào câu trả lời đánh giá.</text><rect x="24" y="382" width="672" height="68" rx="14" fill="#F7F8FC" stroke="#E4E7F2" stroke-width="1.5"/><circle cx="56" cy="416.0" r="17" fill="#64748B"/><text x="56" y="422.3" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="88" y="410" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#030815" text-anchor="start">Độ dài và nhịp câu</text><text x="88" y="436" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#1E293B" text-anchor="start">Câu ngắn, như nhắn cho người quen.</text></svg>