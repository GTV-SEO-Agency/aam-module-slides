<svg xmlns="http://www.w3.org/2000/svg" class="sd sd-c" viewBox="0 0 720 458" role="img" aria-label="Một lời giao việc có 15 luật: AI nhớ rõ luật ở đầu và cuối, luật ở giữa mờ dần"><defs><linearGradient id="s7b5a1cg" x1="0" x2="1"><stop offset="0" stop-color="#B23BF0"/><stop offset=".45" stop-color="#7C5CF7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><marker id="s7b5a1ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect x="8" y="8" width="470" height="442" rx="18" fill="#fff" stroke="#E4E7F2" stroke-width="1.5"/><rect x="8" y="8" width="470" height="5" rx="2.5" fill="url(#s7b5a1cg)"/><text x="32" y="46" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#030815" text-anchor="start">Lời giao việc: 15 luật một lần</text><text x="32" y="82" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#030815" text-anchor="start">1. Đúng thứ tự dàn ý</text><text x="32" y="106" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#030815" text-anchor="start">2. Đủ độ dài từng mục</text><text x="32" y="130" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#030815" text-anchor="start">3. Viết đoạn văn, ít gạch đầu dòng</text><text x="32" y="154" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#030815" text-anchor="start">4. Không số liệu thiếu nguồn</text><text x="32" y="178" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#8A93A6" text-anchor="start">5. Không hứa kết quả điều trị</text><text x="32" y="202" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#B3BAC7" text-anchor="start">6. Không dùng chữ “cam kết”</text><text x="32" y="226" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#B3BAC7" text-anchor="start">7. Mỗi mục có một việc làm ngay</text><text x="32" y="250" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#B3BAC7" text-anchor="start">8. Xưng “tụi mình”, gọi “anh/chị”</text><text x="32" y="274" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#B3BAC7" text-anchor="start">9. Câu ngắn, mỗi câu một ý</text><text x="32" y="298" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#B3BAC7" text-anchor="start">10. Không dùng từ hoa mỹ</text><text x="32" y="322" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#8A93A6" text-anchor="start">11. Không đưa khuyến mãi vào bài</text><text x="32" y="346" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#030815" text-anchor="start">12. Tên dịch vụ đúng bảng giá</text><text x="32" y="370" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#030815" text-anchor="start">13. Kết bài mời đặt lịch</text><text x="32" y="394" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#030815" text-anchor="start">14. Viết xong mỗi phần thì dừng</text><text x="32" y="418" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#030815" text-anchor="start">15. Ghi số chữ của phần vừa viết</text><rect x="496" y="66" width="8" height="94" rx="4" fill="#A7E3BF"/><text x="522" y="109.0" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="700" fill="#0B6B3A" text-anchor="start">AI nhớ rõ</text><text x="522" y="133.0" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="700" fill="#0B6B3A" text-anchor="start">luật ở đầu</text><rect x="496" y="162" width="8" height="166" rx="4" fill="#F6B8CB"/><text x="522" y="241.0" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="700" fill="#A3002F" text-anchor="start">Luật ở giữa</text><text x="522" y="265.0" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="700" fill="#A3002F" text-anchor="start">dễ bị quên</text><rect x="496" y="330" width="8" height="94" rx="4" fill="#A7E3BF"/><text x="522" y="373.0" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="700" fill="#0B6B3A" text-anchor="start">AI nhớ rõ</text><text x="522" y="397.0" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="700" fill="#0B6B3A" text-anchor="start">luật ở cuối</text></svg>