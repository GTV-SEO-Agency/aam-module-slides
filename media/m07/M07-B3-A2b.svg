<svg xmlns="http://www.w3.org/2000/svg" class="sd sd-c" viewBox="0 0 720 466" role="img" aria-label="JSON prompt ảnh của spa: các ô thương hiệu tô xanh giữ nguyên, ô chủ thể và tỉ lệ khung tô cam đổi theo từng ảnh"><defs><linearGradient id="s7b3a2bcg" x1="0" x2="1"><stop offset="0" stop-color="#B23BF0"/><stop offset=".45" stop-color="#7C5CF7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><marker id="s7b3a2bca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect x="8" y="10" width="244.3" height="30" rx="15.0" fill="#EEFBF3" stroke="#A7E3BF" stroke-width="1.2"/><text x="130.2" y="30.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0B6B3A" text-anchor="middle">Ô xanh: giữ nguyên mọi lần</text><rect x="290" y="10" width="225.2" height="30" rx="15.0" fill="#FDF1E8" stroke="#E9B48C" stroke-width="1.2"/><text x="402.6" y="30.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#8A4317" text-anchor="middle">Ô cam: đổi theo từng ảnh</text><rect x="8" y="54" width="704" height="404" rx="18" fill="#fff" stroke="#E4E7F2" stroke-width="1.5"/><rect x="8" y="54" width="704" height="5" rx="2.5" fill="url(#s7b3a2bcg)"/><text x="32" y="84" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="700" fill="#5B6577" text-anchor="start">{</text><rect x="40" y="94" width="650" height="34" rx="9" fill="#FDF1E8" stroke="#E9B48C" stroke-width="1.2"/><text x="56" y="117" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#8A4317" text-anchor="start">"chủ thể":</text><text x="226" y="117" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">"khăn kem gấp, chậu cây nhỏ",</text><rect x="40" y="134" width="650" height="34" rx="9" fill="#EEFBF3" stroke="#A7E3BF" stroke-width="1.2"/><text x="56" y="157" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0B6B3A" text-anchor="start">"bố cục":</text><text x="226" y="157" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">"chủ thể lệch phải, nhiều khoảng trống",</text><rect x="40" y="174" width="650" height="34" rx="9" fill="#EEFBF3" stroke="#A7E3BF" stroke-width="1.2"/><text x="56" y="197" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0B6B3A" text-anchor="start">"góc máy":</text><text x="226" y="197" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">"ngang tầm mắt, chụp gần",</text><rect x="40" y="214" width="650" height="34" rx="9" fill="#EEFBF3" stroke="#A7E3BF" stroke-width="1.2"/><text x="56" y="237" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0B6B3A" text-anchor="start">"ánh sáng":</text><text x="226" y="237" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">"tự nhiên buổi chiều",</text><rect x="40" y="254" width="650" height="34" rx="9" fill="#EEFBF3" stroke="#A7E3BF" stroke-width="1.2"/><text x="56" y="277" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0B6B3A" text-anchor="start">"màu":</text><text x="226" y="277" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">["#3F6B4F", "#F7F1E6"],</text><rect x="40" y="294" width="650" height="34" rx="9" fill="#EEFBF3" stroke="#A7E3BF" stroke-width="1.2"/><text x="56" y="317" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0B6B3A" text-anchor="start">"phong cách":</text><text x="226" y="317" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">"ảnh chụp thật, cây xanh, khăn kem",</text><rect x="40" y="334" width="650" height="34" rx="9" fill="#EEFBF3" stroke="#A7E3BF" stroke-width="1.2"/><text x="56" y="357" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0B6B3A" text-anchor="start">"không được có":</text><text x="226" y="357" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">"chữ trên ảnh, logo, người tạo dáng",</text><rect x="40" y="374" width="650" height="34" rx="9" fill="#FDF1E8" stroke="#E9B48C" stroke-width="1.2"/><text x="56" y="397" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#8A4317" text-anchor="start">"tỉ lệ khung":</text><text x="226" y="397" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">"1:1"</text><text x="32" y="432" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="700" fill="#5B6577" text-anchor="start">}</text></svg>