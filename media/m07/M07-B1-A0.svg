<svg xmlns="http://www.w3.org/2000/svg" class="sd sd-c" viewBox="0 0 720 350" role="img" aria-label="Cùng một ý massage body 60 phút, 350 nghìn: bài khi chưa có file giọng và bài khi đã có file giọng của spa"><defs><linearGradient id="s7b1a0cg" x1="0" x2="1"><stop offset="0" stop-color="#B23BF0"/><stop offset=".45" stop-color="#7C5CF7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><marker id="s7b1a0ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect x="8" y="8" width="344" height="334" rx="18" fill="#fff" stroke="#F6B8CB" stroke-width="2"/><rect x="28" y="28" width="170.8" height="30" rx="15.0" fill="#FFF5F8" stroke="#F6B8CB" stroke-width="1.2"/><text x="113.4" y="48.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#A3002F" text-anchor="middle">Chưa có file giọng</text><text x="28" y="93.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="400" fill="#030815" text-anchor="start">Bạn đang tìm kiếm một trải nghiệm</text><text x="28" y="118.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="400" fill="#030815" text-anchor="start">thư giãn tuyệt vời? Massage body</text><text x="28" y="143.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="400" fill="#030815" text-anchor="start">60 phút tại Spa An Nhiên mang đến</text><text x="28" y="168.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="400" fill="#030815" text-anchor="start">cho bạn sự thư thái tuyệt đối với</text><text x="28" y="193.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="400" fill="#030815" text-anchor="start">giá chỉ 350 nghìn. Đặt lịch ngay!</text><line x1="28" y1="212.7" x2="332" y2="212.7" stroke="#E4E7F2" stroke-width="1.5"/><circle cx="34" cy="238.67" r="4" fill="#A3002F"/><text x="46" y="243.9" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#A3002F" text-anchor="start">Câu mở chung chung,</text><text x="46" y="266.9" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#A3002F" text-anchor="start">bài nào cũng giống</text><circle cx="34" cy="284.67" r="4" fill="#A3002F"/><text x="46" y="289.9" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#A3002F" text-anchor="start">Từ hoa mỹ: tuyệt vời, tuyệt đối</text><rect x="368" y="8" width="344" height="334" rx="18" fill="#fff" stroke="#A7E3BF" stroke-width="2"/><rect x="388" y="28" width="127.1" height="30" rx="15.0" fill="#EEFBF3" stroke="#A7E3BF" stroke-width="1.2"/><text x="451.5" y="48.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0B6B3A" text-anchor="middle">Có file giọng</text><text x="388" y="93.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="400" fill="#030815" text-anchor="start">Ngồi máy lạnh 10 tiếng, vai</text><text x="388" y="118.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="400" fill="#030815" text-anchor="start">cứng như đá? Tụi mình có 60</text><text x="388" y="143.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="400" fill="#030815" text-anchor="start">phút massage body để anh/chị</text><text x="388" y="168.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="400" fill="#030815" text-anchor="start">nằm yên, không ai hỏi chuyện.</text><text x="388" y="193.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="400" fill="#030815" text-anchor="start">Giá 350 nghìn. Nhắn trang,</text><text x="388" y="218.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="400" fill="#030815" text-anchor="start">spa giữ chỗ trong 15 phút.</text><line x1="388" y1="237.7" x2="692" y2="237.7" stroke="#E4E7F2" stroke-width="1.5"/><circle cx="394" cy="263.67" r="4" fill="#0B6B3A"/><text x="406" y="268.9" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#0B6B3A" text-anchor="start">Xưng tụi mình, gọi khách anh/chị</text><circle cx="394" cy="286.67" r="4" fill="#0B6B3A"/><text x="406" y="291.9" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#0B6B3A" text-anchor="start">Chi tiết thật: 10 tiếng,</text><text x="406" y="314.9" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#0B6B3A" text-anchor="start">60 phút, 15 phút</text></svg>