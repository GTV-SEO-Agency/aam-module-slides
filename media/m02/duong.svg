<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 228" role="img" aria-label="Lộ trình từ chat tới Claude Code"><defs><linearGradient id="ddg" x1="0" x2="1"><stop offset="0" stop-color="#B23BF0"/><stop offset=".45" stop-color="#7C5CF7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><marker id="dda" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><text x="30" y="32" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="20" font-weight="800" fill="#030815" text-anchor="start">Lộ trình: khoá này dạy bước 1 tới 4, khoá nâng cao dạy bước 5</text><rect x="30.0" y="56" width="151.2" height="108" rx="16" fill="#F7F8FE" stroke="#E2E5F3" stroke-width="1.5"/><rect x="44.0" y="66" width="123.19999999999999" height="5" rx="2.5" fill="url(#ddg)"/><text x="44.0" y="100" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="800" fill="#7C3AED" text-anchor="start">1. Chat</text><text x="44.0" y="128" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#030815" text-anchor="start">Viết, tóm tắt,</text><text x="44.0" y="151" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">đọc file gửi lên</text><line x1="185.2" y1="110.0" x2="213.2" y2="110.0" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#dda)"/><rect x="217.2" y="56" width="151.2" height="108" rx="16" fill="#F7F8FE" stroke="#E2E5F3" stroke-width="1.5"/><rect x="231.2" y="66" width="123.19999999999999" height="5" rx="2.5" fill="url(#ddg)"/><text x="231.2" y="100" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="800" fill="#7C3AED" text-anchor="start">2. Project</text><text x="231.2" y="128" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#030815" text-anchor="start">Tài liệu chung,</text><text x="231.2" y="151" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Skill dùng lại</text><line x1="372.4" y1="110.0" x2="400.4" y2="110.0" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#dda)"/><rect x="404.4" y="56" width="151.2" height="108" rx="16" fill="#F7F8FE" stroke="#E2E5F3" stroke-width="1.5"/><rect x="418.4" y="66" width="123.19999999999999" height="5" rx="2.5" fill="url(#ddg)"/><text x="418.4" y="100" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="800" fill="#7C3AED" text-anchor="start">3. Kết nối</text><text x="418.4" y="128" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#030815" text-anchor="start">Gmail, Drive,</text><text x="418.4" y="151" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">việc theo lịch</text><line x1="559.5999999999999" y1="110.0" x2="587.5999999999999" y2="110.0" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#dda)"/><rect x="591.5999999999999" y="56" width="151.2" height="108" rx="16" fill="#F7F8FE" stroke="#E2E5F3" stroke-width="1.5"/><rect x="605.5999999999999" y="66" width="123.19999999999999" height="5" rx="2.5" fill="url(#ddg)"/><text x="605.5999999999999" y="100" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="800" fill="#7C3AED" text-anchor="start">4. Nhiều bước</text><text x="605.5999999999999" y="128" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#030815" text-anchor="start">Claude tự làm</text><text x="605.5999999999999" y="151" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">qua nhiều bước</text><line x1="746.8" y1="110.0" x2="774.8" y2="110.0" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#dda)"/><rect x="778.8" y="56" width="151.2" height="108" rx="16" fill="#FFF5F8" stroke="#F6B8CB" stroke-width="1.5"/><rect x="792.8" y="66" width="123.19999999999999" height="5" rx="2.5" fill="url(#ddg)"/><text x="792.8" y="100" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="800" fill="#7C3AED" text-anchor="start">5. Claude Code</text><text x="792.8" y="128" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#030815" text-anchor="start">Cài phần mềm,</text><text x="792.8" y="151" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">chạy lệnh</text><text x="480" y="206" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="600" fill="#475569" text-anchor="middle">Bạn lên bước sau khi bước trước không làm được việc của bạn.</text></svg>