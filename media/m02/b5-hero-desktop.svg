<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="Cùng bộ não Claude, ba mức tay chân"><defs><linearGradient id="hdg" x1="0" x2="1"><stop offset="0" stop-color="#B23BF0"/><stop offset=".45" stop-color="#7C5CF7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><marker id="hda" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><text x="30" y="36" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="22" font-weight="800" fill="#030815" text-anchor="start">Cùng bộ não Claude, ba mức tay chân</text><rect x="300" y="56" width="360" height="62" rx="16" fill="url(#hdg)"/><text x="480" y="94" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">Model: bộ não (Haiku, Sonnet, Opus)</text><line x1="480" y1="122" x2="172.0" y2="156" stroke="#7C3AED" stroke-width="2" marker-end="url(#hda)"/><rect x="30" y="162" width="284" height="150" rx="16" fill="#F7F8FE" stroke="#E2E5F3" stroke-width="1.5"/><text x="48" y="198" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#7C3AED" text-anchor="start">Chat</text><text x="48" y="228" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Trả lời, viết,</text><text x="48" y="251" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">phân tích file bạn gửi</text><text x="48" y="292" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="start">Chạy ở: Máy chủ của Anthropic</text><line x1="480" y1="122" x2="480.0" y2="156" stroke="#7C3AED" stroke-width="2" marker-end="url(#hda)"/><rect x="338" y="162" width="284" height="150" rx="16" fill="#fff" stroke="#E2E5F3" stroke-width="1.5"/><text x="356" y="198" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#7C3AED" text-anchor="start">Giao việc trong app</text><text x="356" y="228" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Làm nhiều bước, dùng</text><text x="356" y="251" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">trình kết nối, folder đã nối</text><text x="356" y="292" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="start">Chạy ở: Máy chủ của Anthropic</text><line x1="480" y1="122" x2="788.0" y2="156" stroke="#7C3AED" stroke-width="2" marker-end="url(#hda)"/><rect x="646" y="162" width="284" height="150" rx="16" fill="#FFF5F8" stroke="#F6B8CB" stroke-width="1.5"/><text x="664" y="198" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#7C3AED" text-anchor="start">Claude Code</text><text x="664" y="228" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Gõ lệnh, cài phần mềm,</text><text x="664" y="251" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">sửa file trong thư mục</text><text x="664" y="292" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="start">Chạy ở: Máy của bạn</text><text x="480" y="352" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="600" fill="#475569" text-anchor="middle">Hãng khác: Codex (OpenAI) và Antigravity (Google) cùng loại với Claude Code.</text><text x="480" y="378" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="600" fill="#475569" text-anchor="middle">Grok Bot (xAI) chạy trên một máy tính đám mây riêng, đăng nhập vào công cụ của bạn.</text></svg>