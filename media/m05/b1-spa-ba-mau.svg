<svg xmlns="http://www.w3.org/2000/svg" class="sd sd-d" viewBox="0 0 960 470" role="img" aria-label="Mười việc của spa giả định chia vào ba màu dữ liệu"><defs><linearGradient id="h3dg" x1="0" x2="1"><stop offset="0" stop-color="#B23BF0"/><stop offset=".45" stop-color="#7C5CF7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><marker id="h3da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><text x="30" y="36" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="22" font-weight="800" fill="#030815" text-anchor="start">Spa tô màu 10 việc (ví dụ minh hoạ)</text><rect x="30" y="56" width="288" height="400" rx="18" fill="#EEFBF3" stroke="#A7E3BF" stroke-width="1.5"/><text x="48" y="90" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0B6B3A" text-anchor="start">Xanh · dán được</text><rect x="44" y="108" width="260" height="72" rx="12" fill="#FFFFFF" stroke="#A7E3BF" stroke-width="1.5"/><text x="60" y="138" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#030815" text-anchor="start">2. Tóm tắt đánh giá</text><text x="60" y="164" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#5B6577" text-anchor="start">đã xoá số điện thoại</text><rect x="44" y="192" width="260" height="72" rx="12" fill="#FFFFFF" stroke="#A7E3BF" stroke-width="1.5"/><text x="60" y="222" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#030815" text-anchor="start">6. Khuyến mãi tuần</text><text x="60" y="248" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#5B6577" text-anchor="start">bảng giá đã duyệt</text><rect x="44" y="276" width="260" height="72" rx="12" fill="#FFFFFF" stroke="#A7E3BF" stroke-width="1.5"/><text x="60" y="306" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#030815" text-anchor="start">7. Nội quy ca</text><text x="60" y="332" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#5B6577" text-anchor="start">lịch ca không tên</text><rect x="336" y="56" width="288" height="400" rx="18" fill="#FFF8EA" stroke="#F1DBAE" stroke-width="1.5"/><text x="354" y="90" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#7A4300" text-anchor="start">Vàng · che rồi dán</text><rect x="350" y="108" width="260" height="72" rx="12" fill="#FFFFFF" stroke="#F1DBAE" stroke-width="1.5"/><text x="366" y="138" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#030815" text-anchor="start">1. Doanh thu ngày</text><text x="366" y="164" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#5B6577" text-anchor="start">chỉ số tổng</text><rect x="350" y="192" width="260" height="72" rx="12" fill="#FFFFFF" stroke="#F1DBAE" stroke-width="1.5"/><text x="366" y="222" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#030815" text-anchor="start">3. Tin hỏi giá</text><text x="366" y="248" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#5B6577" text-anchor="start">bỏ tên, số điện thoại</text><rect x="350" y="276" width="260" height="72" rx="12" fill="#FFFFFF" stroke="#F1DBAE" stroke-width="1.5"/><text x="366" y="306" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#030815" text-anchor="start">8. Đơn vật tư nháp</text><text x="366" y="332" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#5B6577" text-anchor="start">số nội bộ</text><rect x="642" y="56" width="288" height="400" rx="18" fill="#FFF5F8" stroke="#F6B8CB" stroke-width="1.5"/><text x="660" y="90" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#A3002F" text-anchor="start">Đỏ · không dán</text><rect x="656" y="108" width="260" height="72" rx="12" fill="#FFFFFF" stroke="#F6B8CB" stroke-width="1.5"/><text x="672" y="138" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#030815" text-anchor="start">4. Nhắc lịch hẹn</text><text x="672" y="164" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#5B6577" text-anchor="start">dùng phần mềm đặt lịch</text><rect x="656" y="192" width="260" height="72" rx="12" fill="#FFFFFF" stroke="#F6B8CB" stroke-width="1.5"/><text x="672" y="222" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#030815" text-anchor="start">5. Tư vấn liệu trình</text><text x="672" y="248" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#5B6577" text-anchor="start">dữ liệu sức khoẻ</text><rect x="656" y="276" width="260" height="72" rx="12" fill="#FFFFFF" stroke="#F6B8CB" stroke-width="1.5"/><text x="672" y="306" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#030815" text-anchor="start">9. Khách phàn nàn</text><text x="672" y="332" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#5B6577" text-anchor="start">chỉ mô tả chung</text><rect x="656" y="360" width="260" height="72" rx="12" fill="#FFFFFF" stroke="#F6B8CB" stroke-width="1.5"/><text x="672" y="390" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#030815" text-anchor="start">10. Lương, thưởng</text><text x="672" y="416" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#5B6577" text-anchor="start">lương từng người</text></svg>