<svg xmlns="http://www.w3.org/2000/svg" class="sd sd-d" viewBox="0 0 960 600" role="img" aria-label="Năm cài đặt riêng tư: mỗi cài đặt làm được gì, không làm được gì"><defs><linearGradient id="h2dg" x1="0" x2="1"><stop offset="0" stop-color="#B23BF0"/><stop offset=".45" stop-color="#7C5CF7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><marker id="h2da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><text x="30" y="36" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="22" font-weight="800" fill="#030815" text-anchor="start">Năm cài đặt: làm được gì, không làm được gì</text><text x="40" y="72" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="700" fill="#5B6577" text-anchor="start">Cài đặt</text><text x="270" y="72" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0B6B3A" text-anchor="start">Làm được</text><text x="610" y="72" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="start">Không làm được</text><rect x="30" y="86" width="220" height="84" rx="14" fill="#F7F8FC" stroke="#E4E7F2" stroke-width="1.5"/><text x="46" y="134" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="800" fill="#030815" text-anchor="start">Công tắc huấn luyện</text><rect x="260" y="86" width="330" height="84" rx="14" fill="#EEFBF3" stroke="#A7E3BF" stroke-width="1.5"/><text x="278" y="122" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Chat mới không dùng huấn luyện</text><text x="278" y="146" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">lưu 30 ngày thay vì tới 5 năm</text><rect x="600" y="86" width="330" height="84" rx="14" fill="#F1F3F7" stroke="#D5DAE3" stroke-width="1.5"/><text x="618" y="122" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Không rút dữ liệu khỏi</text><text x="618" y="146" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">model đã huấn luyện</text><rect x="30" y="180" width="220" height="84" rx="14" fill="#F7F8FC" stroke="#E4E7F2" stroke-width="1.5"/><text x="46" y="228" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="800" fill="#030815" text-anchor="start">Link công khai</text><rect x="260" y="180" width="330" height="84" rx="14" fill="#EEFBF3" stroke="#A7E3BF" stroke-width="1.5"/><text x="278" y="216" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Tắt link thì link</text><text x="278" y="240" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">ngừng mở</text><rect x="600" y="180" width="330" height="84" rx="14" fill="#F1F3F7" stroke="#D5DAE3" stroke-width="1.5"/><text x="618" y="216" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Không thu hồi bản người khác</text><text x="618" y="240" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">đã chép hay đăng lại</text><rect x="30" y="274" width="220" height="84" rx="14" fill="#F7F8FC" stroke="#E4E7F2" stroke-width="1.5"/><text x="46" y="322" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="800" fill="#030815" text-anchor="start">Bộ nhớ</text><rect x="260" y="274" width="330" height="84" rx="14" fill="#EEFBF3" stroke="#A7E3BF" stroke-width="1.5"/><text x="278" y="310" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Claude nhớ ý từ chat cũ</text><text x="278" y="334" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">để trả lời sát hơn</text><rect x="600" y="274" width="330" height="84" rx="14" fill="#F1F3F7" stroke="#D5DAE3" stroke-width="1.5"/><text x="618" y="310" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Đi theo bạn sang chat mới;</text><text x="618" y="334" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">bỏ tích ở menu dấu cộng</text><rect x="30" y="368" width="220" height="84" rx="14" fill="#F7F8FC" stroke="#E4E7F2" stroke-width="1.5"/><text x="46" y="416" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="800" fill="#030815" text-anchor="start">Chat ẩn danh</text><rect x="260" y="368" width="330" height="84" rx="14" fill="#EEFBF3" stroke="#A7E3BF" stroke-width="1.5"/><text x="278" y="404" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Không vào lịch sử, bộ nhớ</text><text x="278" y="428" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">không dùng huấn luyện</text><rect x="600" y="368" width="330" height="84" rx="14" fill="#F1F3F7" stroke="#D5DAE3" stroke-width="1.5"/><text x="618" y="404" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Vẫn lưu 30 ngày</text><text x="618" y="428" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">không có trong Project</text><rect x="30" y="462" width="220" height="84" rx="14" fill="#F7F8FC" stroke="#E4E7F2" stroke-width="1.5"/><text x="46" y="510" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="800" fill="#030815" text-anchor="start">Trình kết nối</text><rect x="260" y="462" width="330" height="84" rx="14" fill="#EEFBF3" stroke="#A7E3BF" stroke-width="1.5"/><text x="278" y="498" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Dữ liệu gốc lấy qua connector</text><text x="278" y="522" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">không vào dữ liệu huấn luyện</text><rect x="600" y="462" width="330" height="84" rx="14" fill="#F1F3F7" stroke="#D5DAE3" stroke-width="1.5"/><text x="618" y="498" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Phần dán vào chat vẫn có thể vào</text><text x="618" y="522" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Gmail gửi được email</text><rect x="30" y="560" width="900" height="40" rx="14" fill="#FFF5F8" stroke="#F6B8CB" stroke-width="1.5"/><text x="480" y="586" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#A3002F" text-anchor="middle">Dữ liệu đỏ: không cài đặt nào làm nó an toàn để dán.</text></svg>