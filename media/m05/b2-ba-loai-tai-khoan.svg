<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="Ba loại tài khoản: mua chung, gói cá nhân, gói Team; ai thấy chat, có dùng để huấn luyện không, hợp khi nào"><defs><linearGradient id="h2dg" x1="0" x2="1"><stop offset="0" stop-color="#B23BF0"/><stop offset=".45" stop-color="#7C5CF7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><marker id="h2da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><text x="30" y="36" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="22" font-weight="800" fill="#030815" text-anchor="start">Ba loại tài khoản: ai thấy được chat của bạn</text><rect x="30" y="56" width="288" height="400" rx="18" fill="#FFF5F8" stroke="#F6B8CB" stroke-width="1.5"/><text x="48" y="92" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#A3002F" text-anchor="start">Tài khoản mua chung</text><rect x="44" y="112" width="260" height="104" rx="12" fill="#FFFFFF" stroke="#F6B8CB" stroke-width="1.5"/><text x="60" y="142" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="700" fill="#5B6577" text-anchor="start">Ai thấy chat</text><text x="60" y="170" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">mọi người dùng chung</text><rect x="44" y="224" width="260" height="104" rx="12" fill="#FFFFFF" stroke="#F6B8CB" stroke-width="1.5"/><text x="60" y="254" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="700" fill="#5B6577" text-anchor="start">Có dùng để huấn luyện</text><text x="60" y="282" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">tuỳ cài đặt của</text><text x="60" y="306" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">người chủ tài khoản</text><rect x="44" y="336" width="260" height="104" rx="12" fill="#FFFFFF" stroke="#F6B8CB" stroke-width="1.5"/><text x="60" y="366" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="700" fill="#5B6577" text-anchor="start">Việc công ty</text><text x="60" y="394" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">không dùng</text><rect x="336" y="56" width="288" height="400" rx="18" fill="#E6F3FC" stroke="#A9D4F2" stroke-width="1.5"/><text x="354" y="83" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#05609A" text-anchor="start">Gói cá nhân<tspan x="354" y="104" font-size="15" font-weight="700">(Free, Pro, Max, Ultra)</tspan></text><rect x="350" y="112" width="260" height="104" rx="12" fill="#FFFFFF" stroke="#A9D4F2" stroke-width="1.5"/><text x="366" y="142" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="700" fill="#5B6577" text-anchor="start">Ai thấy chat</text><text x="366" y="170" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">chỉ bạn, trừ khi</text><text x="366" y="194" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">bạn chia sẻ link</text><rect x="350" y="224" width="260" height="104" rx="12" fill="#FFFFFF" stroke="#A9D4F2" stroke-width="1.5"/><text x="366" y="254" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="700" fill="#5B6577" text-anchor="start">Có dùng để huấn luyện</text><text x="366" y="282" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">có công tắc,</text><text x="366" y="306" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">bạn tự tắt</text><rect x="350" y="336" width="260" height="104" rx="12" fill="#FFFFFF" stroke="#A9D4F2" stroke-width="1.5"/><text x="366" y="366" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="700" fill="#5B6577" text-anchor="start">Hợp khi</text><text x="366" y="394" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">đội nhỏ, mỗi người</text><text x="366" y="418" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">tự quản tài khoản</text><rect x="642" y="56" width="288" height="400" rx="18" fill="#EEFBF3" stroke="#A7E3BF" stroke-width="1.5"/><text x="660" y="92" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0B6B3A" text-anchor="start">Gói Team</text><rect x="656" y="112" width="260" height="104" rx="12" fill="#FFFFFF" stroke="#A7E3BF" stroke-width="1.5"/><text x="672" y="142" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="700" fill="#5B6577" text-anchor="start">Ai thấy chat</text><text x="672" y="170" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">chủ tài khoản xin xuất</text><text x="672" y="194" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">được chat của thành viên</text><rect x="656" y="224" width="260" height="104" rx="12" fill="#FFFFFF" stroke="#A7E3BF" stroke-width="1.5"/><text x="672" y="254" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="700" fill="#5B6577" text-anchor="start">Có dùng để huấn luyện</text><text x="672" y="282" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">mặc định không</text><rect x="656" y="336" width="260" height="104" rx="12" fill="#FF