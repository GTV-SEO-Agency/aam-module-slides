<svg xmlns="http://www.w3.org/2000/svg" class="sd sd-d" viewBox="0 0 960 330" role="img" aria-label="Ba màu dữ liệu: xanh đưa vào được, vàng che rồi mới đưa, đỏ không đưa vào AI chat"><defs><linearGradient id="h1dg" x1="0" x2="1"><stop offset="0" stop-color="#B23BF0"/><stop offset=".45" stop-color="#7C5CF7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><marker id="h1da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><text x="30" y="36" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="22" font-weight="800" fill="#030815" text-anchor="start">Ba màu dữ liệu trước khi dán vào AI</text><rect x="30" y="58" width="288" height="176" rx="18" fill="#EEFBF3" stroke="#A7E3BF" stroke-width="1.5"/><text x="50" y="102" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="19" font-weight="800" fill="#0B6B3A" text-anchor="start">Đưa vào được</text><text x="50" y="143" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">Bảng giá đã công bố</text><text x="50" y="166" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">Đánh giá công khai</text><text x="50" y="189" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">đã xoá số điện thoại</text><text x="50" y="212" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">Quy trình không tên người</text><rect x="336" y="58" width="288" height="176" rx="18" fill="#FFF8EA" stroke="#F1DBAE" stroke-width="1.5"/><text x="356" y="102" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="19" font-weight="800" fill="#7A4300" text-anchor="start">Che rồi mới đưa</text><text x="356" y="143" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">Tin nhắn khách: bỏ tên,</text><text x="356" y="166" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">bỏ số điện thoại</text><text x="356" y="189" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">Doanh thu: chỉ số tổng</text><text x="356" y="212" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">Hồ sơ ứng viên: bỏ tên</text><rect x="642" y="58" width="288" height="176" rx="18" fill="#FFF5F8" stroke="#F6B8CB" stroke-width="1.5"/><text x="662" y="102" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="19" font-weight="800" fill="#A3002F" text-anchor="start">Không đưa vào AI chat</text><text x="662" y="143" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">Mật khẩu, mã OTP</text><text x="662" y="166" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">Số thẻ, ảnh căn cước</text><text x="662" y="189" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">Sức khoẻ của khách</text><text x="662" y="212" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">Lương từng người</text><rect x="30" y="270" width="900" height="46" rx="14" fill="#F1F3F7" stroke="#D5DAE3" stroke-width="1.5"/><text x="480" y="300" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">Cài đặt riêng tư giảm rủi ro, không đổi màu của dữ liệu.</text></svg>