<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-label="Chữ thân thiện có ít nhất ba cách hiểu. Một câu trả lời mẫu cho AI thấy cách hiểu của tiệm."><defs><linearGradient id="cg" x1="0" x2="1"><stop offset="0" stop-color="#B23BF0"/><stop offset=".45" stop-color="#7C5CF7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><text x="30" y="34" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="20" font-weight="800" fill="#030815" text-anchor="start">Bạn dặn “trả lời thân thiện”: AI chọn một trong nhiều cách hiểu</text><rect x="380" y="54" width="200" height="46" rx="23" fill="#FFF5F8" stroke="#F6B8CB" stroke-width="1.5"/><text x="480" y="84" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="800" fill="#A3002F" text-anchor="middle">“thân thiện”</text><rect x="30" y="128" width="280" height="200" rx="16" fill="#F7F8FE" stroke="#E2E5F3" stroke-width="1.5"/><text x="48" y="160" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="800" fill="#7C3AED" text-anchor="start">Cách hiểu A</text><text x="48" y="192" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#030815" text-anchor="start">“Chào chị yêu! Cảm ơn chị đã</text><text x="48" y="214" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#030815" text-anchor="start">quan tâm tới sản phẩm của shop,</text><text x="48" y="236" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#030815" text-anchor="start">shop xin gửi chị thông tin</text><text x="48" y="258" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#030815" text-anchor="start">chi tiết như sau…”</text><text x="48" y="306" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="start">Nhiều lời chào, câu dài</text><rect x="340" y="128" width="280" height="200" rx="16" fill="#F7F8FE" stroke="#E2E5F3" stroke-width="1.5"/><text x="358" y="160" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="800" fill="#7C3AED" text-anchor="start">Cách hiểu B</text><text x="358" y="192" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#030815" text-anchor="start">“Chào bạn. Sản phẩm có hỗ trợ</text><text x="358" y="214" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#030815" text-anchor="start">khắc tên. Thời gian giao hàng</text><text x="358" y="236" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#030815" text-anchor="start">từ 1 đến 4 ngày.”</text><text x="358" y="306" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="start">Lịch sự, đủ ý, nhưng cứng</text><rect x="650" y="128" width="280" height="200" rx="16" fill="#F0FBF5" stroke="#A7E3C3" stroke-width="2"/><text x="668" y="160" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="800" fill="#0F7A4A" text-anchor="start">Đúng ý tiệm</text><text x="668" y="192" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#030815" text-anchor="start">“Dạ được chị, shop khắc tên</text><text x="668" y="214" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#030815" text-anchor="start">miễn phí, làm thêm 1 ngày.</text><text x="668" y="236" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#030815" text-anchor="start">Chị muốn khắc chữ gì ạ?”</text><text x="668" y="306" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F7A4A" text-anchor="start">Ngắn, xưng shop, hỏi để chốt</text><text x="30" y="362" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Câu chữ minh hoạ, tiệm đồ da giả định.</text></svg>