<svg xmlns="http://www.w3.org/2000/svg" class="sd sd-m" viewBox="0 0 600 1564" role="img" aria-label="Quy trình bài đăng đa kênh 7 bước: mỗi bước một model và một nhãn mức nỗ lực; bước 6 là người duyệt"><defs><linearGradient id="m03b5a1mg" x1="0" x2="1"><stop offset="0" stop-color="#B23BF0"/><stop offset=".45" stop-color="#7C5CF7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><marker id="m03b5a1ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect x="16" y="16" width="568" height="184" rx="14" fill="#F3F0FF" stroke="#CFC3FF" stroke-width="1.5"/><text x="34" y="52.7" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="24" font-weight="800" fill="#4318C9" text-anchor="start">1. Tìm hiểu chủ đề</text><text x="34" y="88.7" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="22" font-weight="700" fill="#4318C9" text-anchor="start">Opus 5.5</text><text x="34" y="124.7" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="22" font-weight="400" fill="#5B6577" text-anchor="start">bật tìm web</text><rect x="34" y="140" width="74.1" height="42" rx="21.0" fill="#FFFFFF" stroke="#D5DAE8" stroke-width="1.2"/><text x="71.0" y="168.7" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="22" font-weight="700" fill="#030815" text-anchor="middle">Cao</text><rect x="16" y="240" width="568" height="184" rx="14" fill="#EEFBF3" stroke="#A7E3BF" stroke-width="1.5"/><text x="34" y="276.7" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="24" font-weight="800" fill="#0B6B3A" text-anchor="start">2. Lập dàn ý</text><text x="34" y="312.7" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="22" font-weight="700" fill="#0B6B3A" text-anchor="start">Opus 5.5 hoặc Gemini Neon, Hydrogen</text><text x="34" y="348.7" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="22" font-weight="400" fill="#5B6577" text-anchor="start">người duyệt dàn ý</text><rect x="34" y="364" width="74.1" height="42" rx="21.0" fill="#FFFFFF" stroke="#D5DAE8" stroke-width="1.2"/><text x="71.0" y="392.7" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="22" font-weight="700" fill="#030815" text-anchor="middle">Cao</text><rect x="16" y="464" width="568" height="184" rx="14" fill="#E6F3FC" stroke="#A9D4F2" stroke-width="1.5"/><text x="34" y="500.7" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="24" font-weight="800" fill="#05609A" text-anchor="start">3. Viết bản nháp</text><text x="34" y="536.7" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="22" font-weight="700" fill="#05609A" text-anchor="start">Gemini Hydrogen</text><text x="34" y="572.7" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="22" font-weight="400" fill="#5B6577" text-anchor="start">có file giọng</text><rect x="34" y="588" width="160.5" height="42" rx="21.0" fill="#FFFFFF" stroke="#D5DAE8" stroke-width="1.2"/><text x="114.3" y="616.7" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="22" font-weight="700" fill="#030815" text-anchor="middle">Trung bình</text><rect x="16" y="688" width="568" height="148" rx="14" fill="#E6F3FC" stroke="#A9D4F2" stroke-width="1.5"/><text x="34" y="724.7" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="24" font-weight="800" fill="#05609A" text-anchor="start">4. Chuyển thành các kênh</text><text x="34" y="760.7" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="22" font-weight="700" fill="#05609A" text-anchor="start">Gemini Hydrogen</text><rect x="34" y="776" width="87.2" height="42" rx="21.0" fill="#FFFFFF" stroke="#D5DAE8" stroke-width="1.2"/><text x="77.6" y="804.7" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="22" font-weight="700" fill="#030815" text-anchor="middle">Thấp</text><rect x="16" y="876" width="568" height="148" rx="14" fill="#E6F3FC" stroke="#A9D4F2" stroke-width="1.5"/>