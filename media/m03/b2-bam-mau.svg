<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-label="Mẫu giống nhau làm AI chép cả chi tiết. Thêm mẫu khác kiểu và câu dặn thì AI lấy thông tin từ dữ liệu đầu vào."><defs><linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#B23BF0"/><stop offset=".45" stop-color="#7C5CF7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><marker id="ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><text x="30" y="34" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="20" font-weight="800" fill="#030815" text-anchor="start">Mặt trái của ví dụ mẫu: AI có thể chép cả chi tiết</text><rect x="30" y="58" width="410" height="145" rx="14" fill="#FFF5F8" stroke="#F6B8CB" stroke-width="1.5"/><text x="48" y="90" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="800" fill="#A3002F" text-anchor="start">Mẫu đưa vào</text><text x="48" y="122" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Hai mẫu cùng mở bằng “Dạ có chị”.</text><text x="48" y="146" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Một mẫu có “giao hoả tốc trong 2 giờ”.</text><rect x="520" y="58" width="410" height="145" rx="14" fill="#FFF5F8" stroke="#F6B8CB" stroke-width="1.5"/><text x="538" y="90" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="800" fill="#A3002F" text-anchor="start">Câu trả lời có thể chép</text><text x="538" y="122" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">“Dạ có chị, ví có màu đỏ ạ. Shop</text><text x="538" y="146" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">giao hoả tốc trong 2 giờ…”</text><text x="538" y="170" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Sai: shop không có màu đỏ, không có hoả tốc.</text><line x1="444" y1="130" x2="512" y2="130" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#ba)"/><rect x="30" y="223" width="410" height="145" rx="14" fill="#F0FBF5" stroke="#A7E3C3" stroke-width="1.5"/><text x="48" y="255" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="800" fill="#0F7A4A" text-anchor="start">Mẫu sau khi sửa</text><text x="48" y="287" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Thêm mẫu 3 trả lời “không”.</text><text x="48" y="311" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Thêm câu dặn: mẫu chỉ để học giọng,</text><text x="48" y="335" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">thông tin lấy ở Dữ liệu đầu vào.</text><rect x="520" y="223" width="410" height="145" rx="14" fill="#F0FBF5" stroke="#A7E3C3" stroke-width="1.5"/><text x="538" y="255" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="800" fill="#0F7A4A" text-anchor="start">Câu trả lời mong muốn</text><text x="538" y="287" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">“Dạ hiện shop chưa có màu đỏ chị ạ,</text><text x="538" y="311" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">chỉ có nâu và đen. Nội thành</text><text x="538" y="335" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">giao 1–2 ngày, chị đặt màu nào ạ?”</text><line x1="444" y1="295" x2="512" y2="295" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#ba)"/><text x="30" y="398" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Câu chữ minh hoạ. Model mới có thể tránh lỗi này ngay lần đầu; câu dặn vẫn nên giữ.</text></svg>