<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 474" role="img" aria-label="Một tờ giao việc có 5 phần, mỗi phần trả lời một câu hỏi. Phần 5 đặt điểm dừng ở bản nháp."><defs><linearGradient id="cg" x1="0" x2="1"><stop offset="0" stop-color="#B23BF0"/><stop offset=".45" stop-color="#7C5CF7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><text x="30" y="34" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="20" font-weight="800" fill="#030815" text-anchor="start">Một tờ giao việc có 5 phần, mỗi phần trả lời một câu hỏi</text><rect x="30" y="58" width="900" height="62" rx="14" fill="#F7F8FE" stroke="#E2E5F3" stroke-width="1.5"/><circle cx="66" cy="89.0" r="17" fill="#7C3AED"/><text x="66" y="95.0" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="98" y="95.0" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#7C3AED" text-anchor="start">Bối cảnh</text><text x="330" y="95.0" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Bạn là ai? Kết quả dành cho ai, để làm gì?</text><rect x="30" y="132" width="900" height="62" rx="14" fill="#F7F8FE" stroke="#E2E5F3" stroke-width="1.5"/><circle cx="66" cy="163.0" r="17" fill="#7C3AED"/><text x="66" y="169.0" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="98" y="169.0" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#7C3AED" text-anchor="start">Việc cần làm</text><text x="330" y="169.0" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Làm việc gì? Một câu, bắt đầu bằng động từ.</text><rect x="30" y="206" width="900" height="62" rx="14" fill="#F7F8FE" stroke="#E2E5F3" stroke-width="1.5"/><circle cx="66" cy="237.0" r="17" fill="#7C3AED"/><text x="66" y="243.0" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="98" y="243.0" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#7C3AED" text-anchor="start">Dữ liệu đầu vào</text><text x="330" y="243.0" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Số, tên, tài liệu nào chỉ bạn có?</text><rect x="30" y="280" width="900" height="62" rx="14" fill="#F7F8FE" stroke="#E2E5F3" stroke-width="1.5"/><circle cx="66" cy="311.0" r="17" fill="#7C3AED"/><text x="66" y="317.0" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="98" y="317.0" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#7C3AED" text-anchor="start">Mẫu đầu ra</text><text x="330" y="317.0" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Kết quả trông thế nào: dạng, độ dài, giọng?</text><rect x="30" y="354" width="900" height="62" rx="14" fill="#FFF5F8" stroke="#F6B8CB" stroke-width="2"/><circle cx="66" cy="385.0" r="17" fill="#A3002F"/><text x="66" y="391.0" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="98" y="391.0" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#A3002F" text-anchor="start">Giới hạn và điểm dừng</text><text x="330" y="391.0" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Điều gì không được làm? Khi nào hỏi lại? Dừng ở đâu?</text><text x="30" y="458" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="600" fill="#A3002F" text-anchor="start">Phần 5 là phần khoá thêm: việc gửi ra ngoài luôn dừng ở bản nháp để bạn duyệt.</text></svg>