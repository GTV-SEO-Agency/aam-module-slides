<svg xmlns="http://www.w3.org/2000/svg" class="sd sd-d" viewBox="0 0 960 320" role="img" aria-label="Claude đọc file đánh giá trong Google Drive, soạn bản nháp trong Gmail, bạn đọc rồi tự bấm gửi"><defs><linearGradient id="c4hg" x1="0" x2="1"><stop offset="0" stop-color="#B23BF0"/><stop offset=".45" stop-color="#7C5CF7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><marker id="c4ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><text x="30" y="40" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="20" font-weight="800" fill="#030815" text-anchor="start">Dữ liệu vào từ Drive, kết quả ra thành bản nháp Gmail</text><rect x="30" y="90" width="196" height="110" rx="16" fill="#E6F3FC" stroke="#A9D4F2" stroke-width="1.5"/><text x="128.0" y="139.1" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="700" fill="#05609A" text-anchor="middle">Google Drive</text><text x="128.0" y="163.1" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="700" fill="#05609A" text-anchor="middle">file đánh giá tuần</text><rect x="262" y="90" width="196" height="110" rx="16" fill="#F3F0FF" stroke="#CFC3FF" stroke-width="1.5"/><text x="360.0" y="139.1" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="700" fill="#4318C9" text-anchor="middle">Claude</text><text x="360.0" y="163.1" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="700" fill="#4318C9" text-anchor="middle">Project + Skill</text><rect x="494" y="90" width="196" height="110" rx="16" fill="#FFF8EA" stroke="#F1DBAE" stroke-width="1.5"/><text x="592.0" y="139.1" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="700" fill="#7A4300" text-anchor="middle">Gmail</text><text x="592.0" y="163.1" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="700" fill="#7A4300" text-anchor="middle">Thư nháp</text><rect x="726" y="90" width="196" height="110" rx="16" fill="#EEFBF3" stroke="#A7E3BF" stroke-width="1.5"/><text x="824.0" y="139.1" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0B6B3A" text-anchor="middle">Bạn</text><text x="824.0" y="163.1" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0B6B3A" text-anchor="middle">đọc rồi bấm gửi</text><path d="M230.0,145.0 L254.0,145.0" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#c4ha)"/><text x="244" y="250" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="middle">1. Claude đọc file</text><path d="M462.0,145.0 L486.0,145.0" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#c4ha)"/><text x="476" y="250" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="middle">2. Claude soạn nháp</text><path d="M694.0,145.0 L718.0,145.0" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#c4ha)"/><text x="708" y="250" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="middle">3. Bạn duyệt và gửi</text><text x="30" y="300" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#5B6577" text-anchor="start">Ví dụ minh hoạ: spa giả định ở Cần Thơ. Bạn giữ nút gửi bằng hai lớp ở dưới.</text></svg>