<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-label="Ba tầng nạp của một Skill"><defs><linearGradient id="s2tg" x1="0" x2="1"><stop offset="0" stop-color="#B23BF0"/><stop offset=".45" stop-color="#7C5CF7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><marker id="s2ta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><text x="30" y="36" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="20" font-weight="800" fill="#030815" text-anchor="start">Ba tầng nạp của một Skill</text><rect x="30" y="60" width="900" height="72" rx="14" fill="#F3EEFF" stroke="#B9A2F5" stroke-width="2"/><text x="50" y="90" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="800" fill="#5B21B6" text-anchor="start">Tầng 1 · Tên và mô tả</text><text x="50" y="116" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#030815" text-anchor="start">Luôn nạp, khoảng 100 token mỗi Skill · Claude biết có Skill nào, dùng khi nào</text><rect x="30" y="146" width="780" height="72" rx="14" fill="#F7F8FE" stroke="#E2E5F3" stroke-width="1.5"/><text x="50" y="176" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="800" fill="#030815" text-anchor="start">Tầng 2 · Các bước trong SKILL.md</text><text x="50" y="202" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#030815" text-anchor="start">Khi việc khớp mô tả, dưới 5.000 token · Claude đọc cách làm</text><rect x="30" y="232" width="660" height="72" rx="14" fill="#F7F8FE" stroke="#E2E5F3" stroke-width="1.5"/><text x="50" y="262" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="800" fill="#030815" text-anchor="start">Tầng 3 · File đi kèm</text><text x="50" y="288" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#030815" text-anchor="start">Khi cần, chưa đọc thì không tốn · Bảng giá, mẫu báo giá, script</text><text x="30" y="336" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Token là đơn vị đo lượng chữ Claude đọc, tính vào giới hạn dùng. Số theo tài liệu của Anthropic.</text></svg>