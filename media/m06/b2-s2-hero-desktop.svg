<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="Không có Skill và có Skill"><defs><linearGradient id="s2hg" x1="0" x2="1"><stop offset="0" stop-color="#B23BF0"/><stop offset=".45" stop-color="#7C5CF7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><marker id="s2ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><text x="30" y="36" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="20" font-weight="800" fill="#030815" text-anchor="start">Dạy một lần, Claude tự mở khi việc khớp</text><rect x="30" y="64" width="420" height="230" rx="16" fill="#FFF5F8" stroke="#F6B8CB" stroke-width="2"/><text x="52" y="98" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#A3002F" text-anchor="start">Không có Skill</text><rect x="52" y="116" width="376" height="42" rx="10" fill="#fff" stroke="#F6B8CB" stroke-width="1.5"/><text x="68" y="143" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Tuần 1: dán hướng dẫn báo giá</text><rect x="52" y="170" width="376" height="42" rx="10" fill="#fff" stroke="#F6B8CB" stroke-width="1.5"/><text x="68" y="197" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Tuần 2: dán lại, quên mục giảm giá</text><rect x="52" y="224" width="376" height="42" rx="10" fill="#fff" stroke="#F6B8CB" stroke-width="1.5"/><text x="68" y="251" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Tuần 3: dán lại, sửa lại trình bày</text><rect x="510" y="64" width="420" height="230" rx="16" fill="#F0FBF5" stroke="#A7E3C3" stroke-width="2"/><text x="532" y="98" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#0F7A4A" text-anchor="start">Có Skill</text><rect x="532" y="116" width="376" height="42" rx="10" fill="#fff" stroke="#A7E3C3" stroke-width="1.5"/><text x="548" y="143" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Bạn: "Làm báo giá cho văn phòng 450 m²"</text><line x1="720" y1="162" x2="720" y2="196" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#s2ha)"/><rect x="532" y="200" width="376" height="74" rx="10" fill="#fff" stroke="#A7E3C3" stroke-width="1.5"/><text x="548" y="228" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0F7A4A" text-anchor="start">Claude đọc mô tả, thấy khớp,</text><text x="548" y="254" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">mở cách làm bao-gia-ve-sinh</text><text x="30" y="318" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Ví dụ minh hoạ.</text></svg>