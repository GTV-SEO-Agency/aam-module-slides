<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="Từ bản vẽ quy trình tới một Project có ba phần"><defs><linearGradient id="p1hg" x1="0" x2="1"><stop offset="0" stop-color="#B23BF0"/><stop offset=".45" stop-color="#7C5CF7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><marker id="p1ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><text x="30" y="36" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="20" font-weight="800" fill="#030815" text-anchor="start">Một vai trò, một Project</text><rect x="30" y="120" width="200" height="130" rx="16" fill="#F7F8FE" stroke="#E2E5F3" stroke-width="1.5"/><text x="130" y="172" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#030815" text-anchor="middle">Bản vẽ quy trình</text><text x="130" y="198" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#030815" text-anchor="middle">Module 04</text><line x1="236" y1="185" x2="292" y2="185" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#p1ha)"/><rect x="300" y="70" width="630" height="240" rx="18" fill="#fff" stroke="#7C3AED" stroke-width="2.5"/><text x="320" y="104" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#7C3AED" text-anchor="start">Project: Spa · Trả lời đánh giá</text><rect x="320" y="124" width="188" height="160" rx="14" fill="#F3EEFF" stroke="#B9A2F5" stroke-width="1.5"/><text x="336" y="160" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#5B21B6" text-anchor="start">Hướng dẫn</text><text x="336" y="196" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#030815" text-anchor="start">giọng, luật trả lời,</text><text x="336" y="218" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#030815" text-anchor="start">điểm dừng</text><rect x="524" y="124" width="188" height="160" rx="14" fill="#F3EEFF" stroke="#B9A2F5" stroke-width="1.5"/><text x="540" y="160" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#5B21B6" text-anchor="start">Kho kiến thức</text><text x="540" y="196" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#030815" text-anchor="start">giọng của spa, chủ đề,</text><text x="540" y="218" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#030815" text-anchor="start">khung tóm tắt tuần</text><rect x="728" y="124" width="188" height="160" rx="14" fill="#F7F8FE" stroke="#E2E5F3" stroke-width="1.5"/><text x="744" y="160" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#030815" text-anchor="start">Các chat</text><text x="744" y="196" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#030815" text-anchor="start">mỗi tuần một chat,</text><text x="744" y="218" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#030815" text-anchor="start">dán đánh giá mới</text><text x="30" y="340" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Ví dụ minh hoạ. Hai ô tím dùng lại mỗi tuần; ô xám là phần thay đổi của từng tuần.</text></svg>