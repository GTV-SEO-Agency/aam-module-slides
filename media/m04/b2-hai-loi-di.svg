<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="Hai lối bắt đầu: việc nhiều giờ nhất rủi ro cao và việc vừa đủ giờ rủi ro thấp"><defs><linearGradient id="h2g" x1="0" x2="1"><stop offset="0" stop-color="#B23BF0"/><stop offset=".45" stop-color="#7C5CF7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><marker id="h2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><text x="30" y="34" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="20" font-weight="800" fill="#030815" text-anchor="start">Hai cách chọn quy trình đầu tiên (ví dụ minh hoạ)</text><rect x="30" y="58" width="430" height="70" rx="14" fill="#FFF5F8" stroke="#F6B8CB" stroke-width="1.5"/><text x="48" y="88" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#A3002F" text-anchor="start">Bắt đầu bằng việc nhiều giờ nhất</text><text x="48" y="112" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">AI trả lời thẳng tới khách</text><line x1="245.0" y1="132" x2="245.0" y2="158" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#h2a)"/><rect x="30" y="162" width="430" height="50" rx="12" fill="#fff" stroke="#F6B8CB" stroke-width="1.5"/><text x="48" y="193" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Một câu báo giá sai tới khách</text><line x1="245.0" y1="216" x2="245.0" y2="242" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#h2a)"/><rect x="30" y="246" width="430" height="50" rx="12" fill="#fff" stroke="#F6B8CB" stroke-width="1.5"/><text x="48" y="277" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Chủ spa tắt AI</text><line x1="245.0" y1="300" x2="245.0" y2="326" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#h2a)"/><rect x="30" y="330" width="430" height="50" rx="12" fill="#fff" stroke="#F6B8CB" stroke-width="1.5"/><text x="48" y="361" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Cả đội kết luận AI không dùng được</text><rect x="500" y="58" width="430" height="70" rx="14" fill="#F0FBF5" stroke="#A7E3C3" stroke-width="1.5"/><text x="518" y="88" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#0F7A4A" text-anchor="start">Bắt đầu bằng việc vừa đủ giờ</text><text x="518" y="112" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">phần tới khách: AI soạn nháp, người duyệt</text><line x1="715.0" y1="132" x2="715.0" y2="158" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#h2a)"/><rect x="500" y="162" width="430" height="50" rx="12" fill="#fff" stroke="#A7E3C3" stroke-width="1.5"/><text x="518" y="193" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Sai nằm ở bản nháp, người duyệt sửa</text><line x1="715.0" y1="216" x2="715.0" y2="242" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#h2a)"/><rect x="500" y="246" width="430" height="50" rx="12" fill="#fff" stroke="#A7E3C3" stroke-width="1.5"/><text x="518" y="277" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Đội quen kiểm kết quả của AI</text><line x1="715.0" y1="300" x2="715.0" y2="326" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#h2a)"/><rect x="500" y="330" width="430" height="50" rx="12" fill="#fff" stroke="#A7E3C3" stroke-width="1.5"/><text x="518" y="361" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Mở rộng sang việc khó hơn</text></svg>