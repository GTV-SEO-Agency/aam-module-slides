<svg xmlns="http://www.w3.org/2000/svg" class="sd sd-c" viewBox="0 0 720 960" role="img" aria-label="Bản vẽ một trang của spa trả lời đánh giá Google, ví dụ minh hoạ: tên quy trình, sáu câu, bảng 10 bước có 4 nhãn, thẻ chuẩn bị rút gọn, giờ ước tính, việc trước Module 06"><defs><linearGradient id="m04bta3cg" x1="0" x2="1"><stop offset="0" stop-color="#B23BF0"/><stop offset=".45" stop-color="#7C5CF7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><marker id="m04bta3ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect x="8" y="8" width="704" height="944" rx="16" fill="#FFFFFF" stroke="#D5DAE8" stroke-width="1.5"/><text x="24" y="46" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="800" fill="#030815" text-anchor="start">BẢN VẼ MỘT TRANG</text><text x="696" y="46" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5B6577" text-anchor="end">Ví dụ minh hoạ</text><text x="24" y="72" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#5B6577" text-anchor="start">Spa giả định ở Cần Thơ, quy trình trả lời đánh giá Google</text><rect x="24" y="78" width="330.0" height="162" rx="12" fill="#F7F8FC" stroke="#E4E7F2" stroke-width="1.5"/><circle cx="56" cy="110" r="16" fill="#7C3AED"/><text x="56" y="115.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="82" y="116.0" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#4318C9" text-anchor="start">Tên quy trình</text><text x="40" y="146.5" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">Trả lời đánh giá Google và</text><text x="40" y="168.5" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">tóm tắt tuần cho chủ spa.</text><text x="40" y="194.5" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">Lý do chọn: câu sai còn nằm ở bản</text><text x="40" y="216.5" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">nháp, có người đọc trước khi đăng.</text><rect x="24" y="252" width="330.0" height="118" rx="12" fill="#F7F8FC" stroke="#E4E7F2" stroke-width="1.5"/><circle cx="56" cy="284" r="16" fill="#7C3AED"/><text x="56" y="289.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="82" y="289.9" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#4318C9" text-anchor="start">Giờ ước tính</text><text x="40" y="320.5" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">Khoảng 3 giờ mỗi tuần.</text><text x="40" y="346.5" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">Số ước tính, Module 13 đo lại.</text><rect x="366.0" y="78" width="330.0" height="292" rx="12" fill="#F7F8FC" stroke="#E4E7F2" stroke-width="1.5"/><circle cx="398.0" cy="110" r="16" fill="#7C3AED"/><text x="398.0" y="115.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="424.0" y="116.0" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#4318C9" text-anchor="start">Sáu câu</text><text x="382.0" y="146.5" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">Khi nào chạy: sáng thứ Hai</text><text x="382.0" y="172.5" font-family="Be Vietnam Pro, system-ui, sans-