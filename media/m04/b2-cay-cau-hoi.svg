<svg xmlns="http://www.w3.org/2000/svg" class="sd sd-c" viewBox="0 0 720 550" role="img" aria-label="Cây ba câu hỏi gắn nhãn: không cần AI là Người làm; kết quả ra ngoài thì thêm Người duyệt ngay trước; đủ bốn điều là AI Agents, thiếu là AI Assisted"><defs><linearGradient id="m04b2a3cg" x1="0" x2="1"><stop offset="0" stop-color="#B23BF0"/><stop offset=".45" stop-color="#7C5CF7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><marker id="m04b2a3ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect x="16" y="16" width="350" height="64" rx="14" fill="#F7F8FC" stroke="#E4E7F2" stroke-width="1.5"/><text x="34" y="52.8" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#030815" text-anchor="start">1. Bước này cần AI không?</text><rect x="490" y="16" width="214" height="74" rx="14" fill="#F1F3F7" stroke="#D5DAE3" stroke-width="2"/><text x="504" y="44.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="19" font-weight="800" fill="#334155" text-anchor="start">Người làm</text><text x="504" y="72.7" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">người tự làm bước này</text><path d="M370.0,50.2 L482.0,51.6" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#m04b2a3ca)"/><rect x="393.3" y="20.2" width="65.8" height="24.0" rx="12.0" fill="#fff"/><text x="426.2" y="37.8" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="middle">Không</text><rect x="16" y="140" width="350" height="76" rx="14" fill="#F7F8FC" stroke="#E4E7F2" stroke-width="1.5"/><text x="34" y="171.3" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#030815" text-anchor="start">2. Kết quả ra ngoài công ty, có</text><text x="34" y="194.3" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#030815" text-anchor="start">pháp lý, tài chính, thương hiệu?</text><rect x="490" y="130" width="214" height="96" rx="14" fill="#FFF8EA" stroke="#F1DBAE" stroke-width="2"/><text x="504" y="158.7" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="19" font-weight="800" fill="#7A4300" text-anchor="start">Người duyệt</text><text x="504" y="186.7" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">thêm bước duyệt ngay</text><text x="504" y="208.7" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">trước, rồi hỏi tiếp câu 3</text><path d="M191.0,84.0 L191.0,132.0" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#m04b2a3ca)"/><rect x="197.2" y="91.2" width="37.0" height="24.0" rx="12.0" fill="#fff"/><text x="215.7" y="108.8" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="middle">Có</text><path d="M370,178.0 L482.0,178.0" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#m04b2a3ca)"/><rect x="407.5" y="147.8" width="37.0" height="24.0" rx="12.0" fill="#fff"/><text x="426.0" y="165.3" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="middle">Có</text><rect x="16" y="286" width="350" height="188" rx="14" fill="#F7F8FC" stroke="#E4E7F2" stroke-width="1.5"/><text x="34" y="361.8" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#030815" text-anchor="start">3. Bước có cách làm cố định,</text><text x="34" y="384.8" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#030815" text-anchor="start">có tiêu chí kiểm, chạy lặp,</text><text x="34" y="407.8" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="17" font-weight="800" fill="#030815" text-anchor="start">lấy được dữ liệu qua kết nối?</text><path d="M191.0,220.0 L191.0,278.0" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#m04b2a3ca)"/><rect x="197.2" y="237.0" width="77.6" height="24.0" rx="12.0" fill="#fff"/><text x="236.1" y="254.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="middle">Hỏi tiếp</text><rect x="490" y="286" width="214" height="74" rx="14" fill="#F3F0FF" stroke="#CFC3FF" stroke-width="2"/><text x="504" y="314.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="19" font-weight="800" fill="#4318C9" text-anchor="start">AI Agents</text><text x="504" y="342.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">đủ cả bốn điều</text><rect x="490" y="400" width="214" height="74" rx="14" fill="#E6F3FC" stroke="#A9D4F2" stroke-width="2"/><text x="504" y="428.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="19" font-weight="800" fill="#05609A" text-anchor="start">AI Assisted</text><text x="504" y="456.6" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="400" fill="#030815" text-anchor="start">thiếu một điều trở lên</text><path d="M370,323.0 L482.0,323.0" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#m04b2a3ca)"/><rect x="395.2" y="292.8" width="61.5" height="24.0" rx="12.0" fill="#fff"/><text x="426.0" y="310.4" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="middle">Đủ cả</text><path d="M370,437.0 L482.0,437.0" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#m04b2a3ca)"/><rect x="395.2" y="406.8" width="61.5" height="24.0" rx="12.0" fill="#fff"/><text x="426.0" y="424.4" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="700" fill="#7C3AED" text-anchor="middle">Thiếu</text><text x="16" y="510" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#5B6577" text-anchor="start">Bước mới luôn bắt đầu ở AI Assisted. Chạy ổn</text><text x="16" y="532" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="16" font-weight="600" fill="#5B6577" text-anchor="start">vài lần, có tiêu chí rồi mới giao cho AI Agents.</text></svg>