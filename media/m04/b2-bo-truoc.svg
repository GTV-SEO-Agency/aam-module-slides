<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="Sáu bước cũ của spa: bước nào bỏ, gộp, đổi, giữ hay giao cho AI"><defs><linearGradient id="b3bg" x1="0" x2="1"><stop offset="0" stop-color="#B23BF0"/><stop offset=".45" stop-color="#7C5CF7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><marker id="b3ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><text x="30" y="34" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="20" font-weight="800" fill="#030815" text-anchor="start">Hỏi từng bước: hôm nay mới dựng, mình có thêm bước này không?</text><rect x="30" y="58" width="330" height="48" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/><text x="48" y="88" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="700" fill="#030815" text-anchor="start">1. Đọc đánh giá mới</text><line x1="366" y1="82" x2="430" y2="82" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#b3ba)"/><rect x="440" y="58" width="490" height="48" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="458" y="88" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="800" fill="#334155" text-anchor="start">Đổi</text><text x="520" y="88" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">chép vào file chữ, Claude đọc</text><rect x="30" y="118" width="330" height="48" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/><text x="48" y="148" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="700" fill="#030815" text-anchor="start">2. Chép đánh giá vào sổ</text><line x1="40" y1="143" x2="350" y2="143" stroke="#A3002F" stroke-width="3"/><line x1="366" y1="142" x2="430" y2="142" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#b3ba)"/><rect x="440" y="118" width="490" height="48" rx="12" fill="#FFF5F8" stroke="#A3002F" stroke-width="2"/><text x="458" y="148" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="800" fill="#A3002F" text-anchor="start">Bỏ</text><text x="520" y="148" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">bảng phân loại thay cho sổ</text><rect x="30" y="178" width="330" height="48" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/><text x="48" y="208" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="700" fill="#030815" text-anchor="start">3. Viết trả lời</text><line x1="366" y1="202" x2="430" y2="202" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#b3ba)"/><rect x="440" y="178" width="490" height="48" rx="12" fill="#F3EEFF" stroke="#B9A2F5" stroke-width="2"/><text x="458" y="208" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="800" fill="#5B21B6" text-anchor="start">Tách</text><text x="520" y="208" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Claude phân loại, rồi soạn nháp</text><rect x="30" y="238" width="330" height="48" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/><text x="48" y="268" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="700" fill="#030815" text-anchor="start">4. Chủ duyệt mọi câu</text><line x1="366" y1="262" x2="430" y2="262" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#b3ba)"/><rect x="440" y="238" width="490" height="48" rx="12" fill="#FFF4E5" stroke="#F2B66D" stroke-width="2"/><text x="458" y="268" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="800" fill="#9A4D00" text-anchor="start">Đổi</text><text x="520" y="268" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">duyệt từng câu, chia theo dấu</text><rect x="30" y="298" width="330" height="48" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/><text x="48" y="328" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="700" fill="#030815" text-anchor="start">5. Đăng trả lời</text><line x1="366" y1="322" x2="430" y2="322" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#b3ba)"/><rect x="440" y="298" width="490" height="48" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="458" y="328" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="800" fill="#334155" text-anchor="start">Giữ</text><text x="520" y="328" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">người đăng, sau bước duyệt</text><rect x="30" y="358" width="330" height="48" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/><text x="48" y="388" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="700" fill="#030815" text-anchor="start">6. Viết tóm tắt tuần</text><line x1="366" y1="382" x2="430" y2="382" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#b3ba)"/><rect x="440" y="358" width="490" height="48" rx="12" fill="#F3EEFF" stroke="#B9A2F5" stroke-width="2"/><text x="458" y="388" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="800" fill="#5B21B6" text-anchor="start">Tách</text><text x="520" y="388" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="15" font-weight="400" fill="#030815" text-anchor="start">Claude viết, người kiểm, người gửi</text><text x="30" y="428" font-family="Be Vietnam Pro, system-ui, sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="start">Thêm hai bước mới: xoá thông tin riêng (người làm), đánh dấu câu cần chủ xem (AI làm). 6 bước thành 10.</text></svg>